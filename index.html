<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Broong Inc.">
  <meta property="og:locale" content="en_US">
  <meta property="og:url" content="https://broong.com/">
  <meta property="og:title" content="Broong Inc. — Apps and AI Products">
  <meta property="og:description" content="Broong Inc. develops consumer apps and AI-powered products, including Beyo, using AI-assisted development and vibe coding workflows.">
  <meta property="og:image" content="https://broong.com/assets/images/og-share.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Broong Inc. — publisher of Beyo">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Broong Inc. — Apps and AI Products">
  <meta name="twitter:description" content="Broong Inc. develops consumer apps and AI-powered products, including Beyo, using AI-assisted development and vibe coding workflows.">
  <meta name="twitter:image" content="https://broong.com/assets/images/og-share.png">

  <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon-32.png">
  <link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png">
  <link rel="stylesheet" href="/assets/css/style.css">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Broong Inc.",
    "url": "https://broong.com",
    "logo": "https://broong.com/assets/images/apple-touch-icon.png",
    "email": "info@broong.com",
    "description": "Broong Inc. develops consumer apps and AI-powered products, including Beyo, using AI-assisted development and vibe coding workflows.",
    "sameAs": [
      "https://beyo.day"
    ],
    "knowsAbout": [
      "consumer apps",
      "AI-powered products",
      "vibe coding",
      "AI-assisted development"
    ],
    "makesOffer": {
      "@type": "Offer",
      "itemOffered": {
        "@type": "SoftwareApplication",
        "name": "Beyo",
        "url": "https://beyo.day",
        "applicationCategory": "ProductivityApplication",
        "operatingSystem": "iOS",
        "downloadUrl": "https://apps.apple.com/app/beyo/id1397284424"
      }
    }
  }
  </script>
</head>
<body class="home">

  <main class="poster">
    <img
      class="poster-title"
      src="/assets/images/site_title@2x.png"
      width="1110"
      height="168"
      alt="Beyo, AI Event Countdown"
      decoding="async"
    >

    <div class="poster-shots" aria-label="Beyo app screenshots">
      <img
        src="/assets/images/image01@2x.png"
        width="270"
        height="587"
        alt="Beyo home screen with event countdowns"
        decoding="async"
      >
      <img
        src="/assets/images/image02@2x.png"
        width="270"
        height="587"
        alt="Beyo event detail with countdown and reminders"
        decoding="async"
      >
      <img
        src="/assets/images/image03@2x.png"
        width="270"
        height="587"
        alt="Beyo preparation checklist for an upcoming event"
        decoding="async"
      >
      <img
        src="/assets/images/image04@2x.png"
        width="270"
        height="587"
        alt="Beyo capturing an event from a photo or screenshot"
        decoding="async"
      >
    </div>

    <a
      class="poster-icon-link"
      href="https://apps.apple.com/app/beyo/id1397284424"
      aria-label="Download Beyo on the App Store"
    >
      <img
        class="poster-icon"
        src="/assets/images/app_icon@2x.png"
        width="90"
        height="90"
        alt="Beyo app icon"
        decoding="async"
      >
    </a>

    <a
      class="poster-badge"
      href="https://apps.apple.com/app/beyo/id1397284424"
      aria-label="Download on the App Store"
    >
      <img
        src="/assets/images/appstore.svg"
        width="120"
        height="40"
        alt="Download on the App Store"
        decoding="async"
      >
    </a>

    <img
      class="poster-copy"
      src="/assets/images/allrightsreserved@2x.png"
      width="370"
      height="21"
      alt="© 2026 Broong Inc. All rights reserved."
      decoding="async"
    >

    <a class="poster-email" href="#" aria-label="Email Broong Inc." id="poster-email">
      <img
        src="/assets/images/email@2x.png"
        width="38"
        height="26"
        alt="Email"
        decoding="async"
      >
    </a>
  </main>

  <script>
    (function () {
      var el = document.getElementById("poster-email");
      if (!el) return;
      el.addEventListener("click", function (e) {
        e.preventDefault();
        window.location.href = "mailto:" + "info" + "@" + "broong.com";
      });
    })();
  </script>
</body>
</html>
